# Netlify build settings.
#
# Netlify detects Next.js and applies its Next.js Runtime automatically — the
# App Router pages are served from the edge and the /api routes become
# serverless functions. Nothing here overrides that; it only pins the things
# that are worth not leaving to a default.

# No `publish` here, deliberately.
#
# Netlify's Next.js Runtime v5 decides its own output directory and wires the
# server routes up as functions. Setting `publish = ".next"` is the v4
# convention, and on v5 it makes Netlify serve the raw build folder as static
# files instead — which contains no index.html, so every route returns 404.
[build]
  command = "npm run build"

# Declared rather than left to detection.
#
# Netlify normally spots Next.js from package.json and applies this itself, but
# the site reported "Runtime: Not set" and shipped no functions — every route,
# API ones included, returned 404 because the build output was served as plain
# static files. Naming the plugin removes the guesswork.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # The route handler uses AbortSignal.timeout, which needs Node 18 or newer.
  # Pinning it means a change to Netlify's default cannot break the build.
  NODE_VERSION = "20"

# The station directory is a free, volunteer-run service. Caching the proxy
# response at the edge keeps traffic off it and makes tab switching instant.
# The route's own `revalidate` already does this server-side; this covers the
# browser and the CDN.
[[headers]]
  for = "/api/stations"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

# The song changes every few minutes, so this is cached only briefly — long
# enough that several listeners on one station share a single read of the
# stream rather than each opening their own connection to it.
[[headers]]
  for = "/api/nowplaying"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=15, stale-while-revalidate=30"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Speech recognition needs the microphone. Everything else is denied.
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
