# Netlify build settings.
#
# Netlify detects Next.js and applies its Next.js Runtime automatically — the
# App Router pages are served from the edge and /api/stations becomes a
# serverless function. Nothing here overrides that; it only pins the things
# that are worth not leaving to a default.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # The route handler uses AbortSignal.timeout, which needs Node 18 or newer.
  # Pinning it means a change to Netlify's default cannot break the build.
  NODE_VERSION = "20"

# The station directory is a free, volunteer-run service. Caching the proxy
# response at the edge keeps traffic off it and makes tab switching instant.
# The route's own `revalidate` already does this server-side; this covers the
# browser and the CDN.
[[headers]]
  for = "/api/stations"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=3600, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Speech recognition needs the microphone. Everything else is denied.
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
