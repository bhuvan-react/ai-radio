<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SV Radio">
  <title>SV Radio</title>

  <!--
    The dial, not the cabinet.

    A favicon is read at 16px. Speaker grille dots and wood grain turn to mud
    at that size, so this keeps the three things that survive: the warm ground,
    the pale dial band, and the amber needle sitting off centre the way a tuned
    dial actually looks.
  -->

  <rect width="64" height="64" rx="14" fill="#4A3122"/>
  <rect width="64" height="64" rx="14" fill="url(#grain)"/>

  <!-- dial glass -->
  <rect x="9" y="19" width="46" height="26" rx="4" fill="#EFE2C2"/>
  <rect x="9" y="19" width="46" height="26" rx="4" fill="url(#sheen)"/>

  <!-- the band, with a few ticks: enough to read as a scale, few enough to stay distinct -->
  <rect x="14" y="31" width="36" height="1.6" rx="0.8" fill="#A88E57"/>
  <g fill="#8A703C">
    <rect x="14" y="25" width="1.8" height="6" rx="0.9"/>
    <rect x="26" y="27" width="1.8" height="4" rx="0.9"/>
    <rect x="38" y="25" width="1.8" height="6" rx="0.9"/>
    <rect x="48.2" y="27" width="1.8" height="4" rx="0.9"/>
  </g>

  <!-- the needle, parked off centre -->
  <rect x="34.5" y="20" width="5" height="23" rx="2.5" fill="#C6400F"/>
  <rect x="34.5" y="20" width="5" height="23" rx="2.5" fill="url(#flame)"/>

  <!-- brass foot, the only hint of the cabinet -->
  <rect x="20" y="50" width="24" height="4" rx="2" fill="#C9A74E"/>

  <defs>
    <linearGradient id="grain" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#5E3D28"/>
      <stop offset="0.5" stop-color="#3E2819" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5A3B27"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="19" x2="0" y2="45">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C7AE7C" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="20" x2="0" y2="43">
      <stop offset="0" stop-color="#FFB45C"/>
      <stop offset="1" stop-color="#C6400F"/>
    </linearGradient>
  </defs>
</svg>
